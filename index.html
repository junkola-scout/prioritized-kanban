<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperspace Insights Kanban</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: PLANA Hyperspace app shell (236px rail + header + tab bars) with the Insights
   body switching between today's signal cards and a workflow board cut into priority rows. */
:root{
  color-scheme:dark;
  --bg:#0c0c0d; --bar:rgba(12,12,13,.95);
  --surface:#1a1a1c; --surface-2:#232326; --surface-3:#2c2c2f;
  --line:#39383b; --line-2:#555459; --line-3:#454247;
  --fg:#ffffff; --muted:#aaa9ae; --dim:#7d7c81; --off:#77767b;
  --orange:#e56203; --orange-hi:#f18a42; --red:#e50602; --coral:#ff6b69; --amber:#f4ba78; --green:#4cc38a;
  --card-bg:linear-gradient(#1e1e21,#1a1a1c 55%,#18181a);
  --hot:linear-gradient(90deg,#e50602,#e53b02);
  --font:"Google Sans","Google Sans Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --col:minmax(170px,1fr); --minw:1068px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--font);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:flex;height:100%;background:radial-gradient(2100px 830px at 55% 122%,rgba(229,6,2,.34),rgba(229,98,3,.13) 34%,rgba(0,0,0,0) 70%),var(--bg)}

/* ── Left rail ── */
.rail-nav{width:236px;flex:none;display:flex;flex-direction:column;background:linear-gradient(#1d1d20,#1a1a1c 30%,#161618);border-right:1px solid var(--line);min-height:0}
.brand{position:relative;padding:18px 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:73px}
.logo{display:flex;align-items:center;gap:7px;color:var(--fg)}
.logo svg{width:26px;height:26px;flex:none}
.logo-w{display:flex;flex-direction:column;line-height:1}
.logo-w b{font-weight:500;font-size:21px;letter-spacing:.2em;transform:scaleX(1.12);transform-origin:left}
.logo-w i{font-size:7.5px;letter-spacing:.34em;margin-top:3px;border-top:1px solid var(--fg);padding-top:2px;font-weight:500}
.logo-w em{font-style:normal;font-size:6.5px;font-weight:800;letter-spacing:.14em;color:var(--orange);align-self:flex-end;margin-top:1px}
.collapse{position:absolute;top:7px;right:8px;width:28px;height:28px;display:grid;place-items:center;color:var(--muted);border-radius:6px}
.collapse:hover{color:var(--fg);background:var(--surface-2)}
.nav{flex:1;overflow-y:auto;padding:14px 10px;min-height:0}
.nav h6{margin:0;padding:9px 8px 5px;font:800 10px/15px var(--font);letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.nav h6:not(:first-child){margin-top:4px}
.ni{display:flex;align-items:center;gap:9px;width:100%;height:37px;padding:8px 10px;border-radius:7px;font-size:14px;color:var(--fg);white-space:nowrap}
.ni svg.ic{width:17px;height:17px;color:var(--muted)}
.ni span{flex:1;overflow:hidden;text-overflow:ellipsis}
.ni:hover{background:rgba(255,255,255,.05)}
.ni.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--orange)}
.ni.on svg.ic:first-child{color:var(--fg)}
.ni.off{color:var(--dim)} .ni.off svg.ic{color:var(--dim)}
.ni .tail{width:13px;height:13px;color:var(--dim)}
.ni .cnt{flex:none;font:800 10px/15px var(--font);color:var(--orange)}
.ni.sm{height:36px}
.ni.add{height:30px;padding-left:32px;color:var(--dim);font-size:13.5px}
.ni.add svg.ic{width:14px;height:14px;color:var(--dim)}
.rail-foot{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.fbtn{height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;padding:0 12px;white-space:nowrap}
.fbtn.pri{background:var(--orange);border:1px solid var(--orange-hi);font-weight:700}
.fbtn.sec{background:var(--surface);border:1px solid var(--line-2)}
.fbtn.sec:hover{border-color:var(--muted)}
.me{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;min-width:0}
.me:hover{background:rgba(255,255,255,.05)}
.av{width:32px;height:32px;flex:none;border-radius:50%;background:#414042;display:grid;place-items:center;font:800 12px var(--font)}
.me-t{flex:1;min-width:0;display:flex;flex-direction:column}
.me-t b{font-weight:600;font-size:13px;line-height:20px}
.me-t small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me>svg.ic{color:var(--muted);width:14px;height:14px}

.app.mini .rail-nav{width:58px}
.app.mini .logo-w,.app.mini .nav h6,.app.mini .ni span,.app.mini .ni .tail,.app.mini .ni .cnt,.app.mini .ni.add,.app.mini .fbtn span,.app.mini .me-t,.app.mini .me>svg.ic{display:none}
.app.mini .brand{padding:18px 0 14px;justify-content:center;flex-direction:column;gap:6px}
.app.mini .collapse{position:static;transform:rotate(180deg)}
.app.mini .nav{padding:14px 9px}
.app.mini .ni{justify-content:center;padding:8px 0}
.app.mini .rail-foot{padding:12px 9px}
.app.mini .fbtn{padding:0}
.app.mini .me{padding:4px;justify-content:center}

/* ── Main column ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{flex:none;height:57px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--bar);display:flex;align-items:center;justify-content:flex-end;gap:14px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--orange);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.syncbtn{height:36px;padding:0 10px;border-radius:7px;border:1px solid var(--orange);background:var(--surface);color:var(--orange);font-size:12px;font-weight:500;white-space:nowrap}
.syncbtn:hover{background:rgba(229,98,3,.12)}
.sq{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center}
.sq svg{width:20px;height:20px}
.bar{flex:none;padding:8px 24px;border-bottom:1px solid var(--line);background:var(--bar);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 12px;border-radius:7px;font-size:13px;line-height:20px;color:var(--muted);display:flex;align-items:center;gap:7px;position:relative;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);font-weight:700}
.tab.line.on::after{content:"";position:absolute;left:12px;right:12px;bottom:1px;height:2px;border-radius:2px;background:var(--orange)}
.tab.sub.on{background:#fff;color:#000}
.badge{font:800 11px/17px var(--font);padding:1px 7px;border-radius:100px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.badge.hot{background:linear-gradient(120deg,#e50602,#e56203 140%);color:#fff}
.tab.sub.on .badge{background:rgba(0,0,0,.1);color:#000}

.scroll{flex:1;min-height:0;overflow-y:auto}
.wrap{max-width:1500px;margin:0 auto;padding:20px 24px 80px;display:flex;gap:24px;align-items:flex-start}
.filterbtn{width:40px;height:40px;flex:none;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.filterbtn:hover,.filterbtn.on{color:var(--fg);border-color:var(--muted)}
.body{flex:1;min-width:0}
.app.kb .wrap{height:100%;padding-bottom:16px;max-width:none}
.app.kb .body{height:100%;display:flex;flex-direction:column;min-height:560px}

.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:36px}
.hd h1{margin:0;font:400 20px/30px var(--font);letter-spacing:-.4px}
.hd .counts{font-size:12px;color:var(--muted)} .hd .counts b{color:var(--fg);font-weight:600}
.hd .sp{flex:1}
.seg{display:flex;height:36px;border:1px solid var(--line);border-radius:7px;background:var(--surface);overflow:hidden}
.seg button{display:flex;align-items:center;gap:7px;padding:0 12px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:rgba(229,98,3,.14);color:var(--amber)}
.gear{width:36px;height:36px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.gear:hover{border-color:var(--line-2)}
.legend{display:flex;justify-content:flex-end;gap:12px;font-size:11px;color:var(--dim);margin-top:10px;min-height:17px}
.legend span{display:flex;align-items:center;gap:5px}
.legend svg.ic{width:12px;height:12px}
.c-green{color:var(--green)} .c-amber{color:var(--amber)}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--muted);max-width:420px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:400 13px var(--font)}
.search input::placeholder{color:var(--dim)}
.active{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:14px 0 12px;min-height:22px}
.active .lb{font-weight:600;letter-spacing:.07em}
.active .chip{border:1px solid var(--orange);color:var(--orange);font-weight:600;padding:1px 10px;border-radius:100px;line-height:18px}
.active b{font-weight:600}
.active .sp{flex:1}
.notes{display:flex;align-items:center;gap:6px;border:1px dashed var(--line-2);border-radius:100px;padding:1px 10px;line-height:18px;color:var(--muted)}
.notes:hover{color:var(--fg);border-color:var(--muted)}
.notes svg.ic{width:12px;height:12px}

/* ── Signal cards (current PLANA view) ── */
.grp{margin-bottom:28px}
.grp-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.grp-h h2{margin:0;font:700 11px/17px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.grp-h h2.hot,.lane-critical .lane-name{background:linear-gradient(90deg,var(--coral),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.grp-h .n{font:800 12px/18px var(--font);color:var(--muted)}
.grp-h i{flex:1;height:1px;background:linear-gradient(90deg,var(--line),rgba(0,0,0,0))}
.sig{position:relative;border:1px dashed var(--line-2);border-radius:10px;padding:16px 18px;background:var(--card-bg);margin-bottom:36px;overflow:hidden}
.sig.official{border-style:solid}
.sig::before,.kc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar-c,transparent)}
.p-critical{--bar-c:linear-gradient(#e50602,#e56203)} .p-high{--bar-c:var(--orange)} .p-medium{--bar-c:var(--amber)} .p-low{--bar-c:var(--line-2)} .p-none{--bar-c:transparent}
.sig-top{display:flex;gap:12px;align-items:flex-start}
.sig-t{flex:1;min-width:0;display:flex;gap:8px;align-items:flex-start}
.type{flex:none;font:800 9px/22px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:2px;padding:0 6px}
.sig-t .type{margin-top:8px}
.sig-t h3{margin:0;font:700 clamp(19px,1.1vw + 10px,30px)/1.17 var(--font);letter-spacing:-.025em;text-wrap:balance}
.acts{display:flex;gap:7px;flex:none}
.btn{height:31px;padding:0 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{color:var(--off);background:var(--surface-3);border-color:#38383c}
.btn.dots{width:31px;padding:0;background:none;border-color:var(--line-3);color:var(--muted);letter-spacing:1px;text-align:center;font-weight:500}
.sig p{margin:7px 0 0;max-width:640px;font-size:13.5px;line-height:21px;color:var(--muted)}
.more{color:var(--orange);font-size:13.5px}
.meta{display:flex;align-items:center;gap:8px;margin-top:24px;font-size:12px;color:var(--muted);min-height:24px;flex-wrap:wrap}
.meta>svg.ic{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 12px;border-radius:8px;font:700 12px/18px var(--font);color:#fff;background:var(--hot);border:1px solid transparent;white-space:nowrap}
.pill svg.ic{width:13px;height:13px;stroke-width:2.4}
.pill.low{background:none;color:var(--muted);border-color:var(--line-2)}
.pill.none{background:none;color:var(--dim);border:1px dashed var(--line-2)}
.sig-foot{display:flex;align-items:center;margin-top:8px}
.sig-foot .det{flex:1;display:flex;justify-content:center;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.12em;color:var(--dim);padding:2px 6px}
.sig-foot .det:hover{color:var(--muted)}
.sig-foot .det svg.ic{width:11px;height:11px}
.sig-foot .det[aria-expanded="true"] svg.ic{transform:rotate(180deg)}
.id{font:400 12px/16px var(--mono);letter-spacing:.1em;color:var(--dim)}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px;margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.dl dt{font:800 9.5px/14px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.dl dd{margin:2px 0 0;font-size:13px}
.none-msg{border:1px dashed var(--line);border-radius:10px;padding:36px 16px;text-align:center;color:var(--dim);font-size:13px}

/* ── Kanban ── */
.kb-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.eyebrow{font:800 10px/15px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.kb-hint{font-size:11.5px;color:var(--dim)}
.track{display:flex;align-items:center;gap:8px;margin:8px 0 10px}
.track button{width:32px;height:32px;flex:none;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.track button:hover:not(:disabled){background:var(--surface-2);color:var(--fg)}
.track button:disabled{opacity:.3}
.track .t{flex:1;height:8px;border-radius:999px;background:var(--surface-3);position:relative;overflow:hidden}
.track .t i{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--line-2)}
.board{flex:1;min-height:0;overflow:auto;border-radius:10px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;overscroll-behavior:contain}
.board-in{width:100%;min-width:var(--minw);padding-bottom:8px}
.cols,.cells{display:grid;grid-template-columns:repeat(6,var(--col));gap:12px}
.cols{position:sticky;top:0;z-index:3;background:#101011;padding-bottom:8px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(#232326,#19191b)}
.col-h h2{margin:0;font:700 10.5px/15px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.col-h .n{font:800 10px/15px var(--font);padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-3);color:var(--muted);font-variant-numeric:tabular-nums}
.lane{margin-top:6px}
.lane-head{display:flex;padding:6px 0}
.lane-toggle{position:sticky;left:0;display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border-radius:7px;max-width:100%}
.lane-toggle:hover{background:rgba(255,255,255,.05)}
.lane-toggle>svg.ic{width:14px;height:14px;color:var(--dim);transition:transform .15s}
.lane.shut .lane-toggle>svg.ic{transform:rotate(-90deg)}
.lane-dot{width:9px;height:9px;border-radius:2px;flex:none;background:var(--bar-c)}
.p-low .lane-dot{background:var(--muted)} .p-none .lane-dot{background:none;border:1px dashed var(--dim)}
.lane-name{font:700 11.5px/17px var(--font);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.lane-high .lane-name{color:var(--orange)} .lane-medium .lane-name{color:var(--amber)} .lane-low .lane-name{color:var(--muted)} .lane-none .lane-name{color:var(--dim)}
.lane-n{font:800 12px/18px var(--font);color:var(--muted);font-variant-numeric:tabular-nums}
.lane-sev{font-size:11px;color:var(--dim);white-space:nowrap}
.lane-rule{flex:1;height:1px;align-self:center;margin-left:10px;background:linear-gradient(90deg,var(--line),rgba(0,0,0,0))}
.cell{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:10px;border:1px solid #2a2a2d;background:rgba(26,26,28,.62);min-height:64px;transition:background .12s,border-color .12s}
.cell.over{border-color:var(--orange);background:rgba(229,98,3,.1)}
.empty{flex:1;display:grid;place-items:center;min-height:46px;border:1px dashed var(--line);border-radius:7px;font-size:11px;color:var(--dim)}
.kc{position:relative;overflow:hidden;border:1px dashed var(--line-2);border-radius:8px;padding:12px 12px 10px 14px;background:linear-gradient(#202023,#19191b);cursor:grab}
.kc.official{border-style:solid}
.kc:hover{border-color:var(--muted)}
.kc.drag{opacity:.35}
.kc-top{display:flex;align-items:center;gap:7px;color:var(--dim)}
.kc-top .sp{flex:1}
.kc-top svg.ic{width:13px;height:13px}
.kc h3{margin:9px 0 0;font:700 14px/19px var(--font);letter-spacing:-.01em}
.kc p{margin:6px 0 0;font-size:12px;line-height:17px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kc footer{display:flex;justify-content:space-between;gap:8px;margin-top:11px;font-size:10px;color:var(--dim)}
.kc footer .id{font-size:10px}

/* ── Floating bits ── */
.fab{position:absolute;right:28px;bottom:26px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#e50602,#e53b02);display:grid;place-items:center;box-shadow:0 8px 24px rgba(229,6,2,.35);z-index:5}
.fab svg.ic{width:18px;height:18px}
.pop{position:fixed;z-index:50;min-width:176px;background:#1e1e21;border:1px solid var(--line-2);border-radius:9px;padding:10px;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.pop h5{margin:0 0 9px;font:800 10px/14px var(--font);letter-spacing:.09em;text-transform:uppercase}
.pop h6{margin:0 0 5px;font:700 8.5px/12px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.opt{display:block;width:100%;padding:6px 9px;border-radius:5px;font-size:12px;font-weight:600;background:var(--surface);border:1px solid transparent;white-space:nowrap}
.opt:hover{border-color:var(--line-2)}
.opt.on{background:var(--hot)}
.pop .cur{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:10.5px;color:var(--dim)} .pop .cur b{color:var(--fg)}
.pop.menu{padding:6px} .pop.menu h6{padding:5px 8px 3px}
.mi{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:5px;font-size:12.5px;white-space:nowrap}
.mi:hover{background:var(--surface-2)} .mi.on{color:var(--amber)}
.pop.note{max-width:340px;font-size:12px;line-height:18px;color:var(--muted)}
.pop.note table{border-collapse:collapse;margin:6px 0 8px;width:100%}
.pop.note td{padding:3px 0;border-bottom:1px solid var(--line)} .pop.note td:first-child{color:var(--fg);font-weight:600;padding-right:12px;white-space:nowrap}
.pop.note p{margin:0 0 6px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);z-index:21;background:linear-gradient(#1d1d20,#161618);border-left:1px solid var(--line);padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;box-shadow:-24px 0 60px rgba(0,0,0,.5)}
.dr-top{display:flex;align-items:center;gap:10px} .dr-top .sp{flex:1}
.x{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted)} .x:hover{background:var(--surface-2);color:var(--fg)}
.drawer h2{margin:0;font:700 22px/1.2 var(--font);letter-spacing:-.02em;text-wrap:balance}
.drawer>p{margin:0;font-size:13.5px;line-height:21px;color:var(--muted)}
.fld h6{margin:0 0 7px;font:800 10px/14px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ch{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12.5px}
.ch:hover{border-color:var(--line-2)}
.ch[aria-pressed="true"]{border-color:var(--orange);background:rgba(229,98,3,.14);color:var(--amber)}
.dr-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.dr-meta span{display:flex;align-items:center;gap:5px} .dr-meta svg.ic{width:13px;height:13px}
.dr-acts{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;background:#232326;border:1px solid var(--line-2);border-radius:9px;padding:9px 14px;font-size:12.5px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.toast button{color:var(--orange);font-weight:700}

@media (max-width:760px){
  :root{--col:262px;--minw:max-content}
  .topbar,.bar{padding-left:16px;padding-right:16px}
  .wrap{padding:16px 16px 72px;gap:12px;flex-direction:column}
  .app.kb .wrap{height:auto} .app.kb .body{height:auto;width:100%} .body{width:100%}
  .board{max-height:74vh}
  .sig-top{flex-direction:column} .sync span{display:none}
  .kb-hint,.lane-sev{display:none}
  .fab{right:16px;bottom:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic=(n,c)=>`<svg class="ic${c?" "+c:""}"><use href="#i-${n}"/></svg>`;
const TOTAL=297;

// Priority rows. Each one is derived from the severity axes PLANA already stores.
const P=[
 {k:"critical",name:"Critical",sev:"Urgent · High impact",group:"Urgent · High impact",u:1,i:1},
 {k:"high",name:"High priority",sev:"Not urgent · High impact",group:"High impact",u:0,i:1},
 {k:"medium",name:"Medium priority",sev:"Urgent · Low impact",group:"Urgent · Low impact",u:1,i:0},
 {k:"low",name:"Low priority",sev:"Not urgent · Low impact",group:"Low impact",u:0,i:0},
 {k:"none",name:"No priority",sev:"No severity set",group:"No severity set"}
];
const PM=Object.fromEntries(P.map(p=>[p.k,p]));
// Workflow columns, same set and order as the Junkola board.
const ST=[["ai","AI extracted"],["ack","Acknowledged"],["prog","In Progress"],["blocked","Blocked"],["review","In Review"],["handled","Handled"]];
const SM=Object.fromEntries(ST);

// id, title, description, priority, status, seen, promote enabled, dismiss enabled
const T=[
[17253,"Ensure platform readiness and working demo","Scout needs to coordinate with Vu to check the platform's readiness level and ensure a small version is running by the end of the week for Mitch and Jeremy to use.","critical","ai","Jul 20",1,1],
[29665,"Platform Sync Now Failure Investigation","Scout Underwood reported a synchronization bug to Vu Pham after clicking Sync Now triggered failures across 20 sync jobs.","critical","blocked","Aug 11",0,0],
[44696,"Deliverables traceability and formal release status tracking establishment","Duc Huy Tran directed Mitch Amos to establish formal tracking for documents undergoing release, sign-off, and approval. Mitch shared a Smartsheet dashboard showing 71 overdue deliverables and negative critical path float, but Duc emphasized that the dashboard lacks backward traceability to verified source documents. Mitch accepted the action to consolidate tracking across all work package deliverables.","critical","prog","Oct 19",0,1],
[17059,"Build Initial Master Schedule","Create the first pass of the program's Gantt chart to track scope, schedule, and critical path.","critical","review","Jul 27",1,1],
[26060,"Deep QA Test Execution and Monitoring","Scout Underwood initiated an expanded QA test run overnight utilizing a newly built custom skill documented in SKILL.md.","high","prog","Aug 27",1,1],
[17096,"Company-wide AI Adoption","The AI system must be rolled out for company-wide usage by August to ensure all documentation and daily updates are captured.","medium","ack","Jul 24",1,1],
[45519,"Review Hyperspace Architecture and Data Governance Questions","Scout Underwood forwarded an email from COO Jacob Cho requesting Vu Pham's technical comments on Hyperspace architecture, data retention, and infrastructure control. Vu Pham is asked to evaluate the four key technical areas and reply back to Scout.","medium","ai","Nov 9",1,1],
[39065,"Send proposal summary to Duc","Jeffrey Mattson to send a short email to Duc outlining the proposal ask and attaching the slide prepared for Tim Draper.","medium","ai","Sep 29",0,1],
[17251,"Develop 3, 6, and 12-month AI project roadmap","Scout needs to create a 3, 6, and 12-month plan for Project 1 and Project 2, assuming more resources will be available.","medium","prog","Jul 20",1,1],
[17547,"Develop First Version of Work Package and Project Schedule","Mitch Amos is assigned to create the initial version of the program work package and overall project schedule following the domestic team call.","medium","handled","Jul 17",0,1],
[17923,"Populate WP Folder Structure","Duc Huy Tran instructed all Work Package leads to populate their respective folders in the new Google Drive structure with current artifacts, drafts, and placeholders.","medium","handled","Jun 26",0,1],
[20014,"Draft communication project presentation","Scout is drafting a 22-page presentation for the communication project based on Duc's email.","medium","review","Apr 30",1,1],
[44697,"Digital asset management workflow and knowledge index implementation","Scout Underwood and Mitch Amos agreed to map out and implement a digital asset management system linked to an index and Hyperspace. Duc Huy Tran emphasized the need for an automated system where approved documents are immediately queryable. Scout committed to meeting with Mitch to map the workflow and reduce manual copy-pasting between spreadsheets.","low","ack","Oct 19",1,1],
[17063,"Roll Out AI Tool Beta","Deploy the AI intelligence tool (Project 1) to the small internal team for a 30-day validation pass.","low","prog","Jul 27",1,1],
[44811,"Evaluate Agentic Human-in-the-Loop Proposal","Scout Underwood proposed an Agentic Human-in-the-Loop layer to manage data quality during the integration of data silos.","low","ai","Oct 21",1,1],
[15555,"Update platform search behavior for broad queries","Duc Huy Tran requested a change to the platform's search logic so it queries all relevant sources for broad questions rather than filtering by specific tools based on phrasing. Scout Underwood added this to the task list.","low","ai","Aug 13",1,1],
[17831,"Test platform onboarding with Mitch Amos","Scout Underwood and Vu Pham need to conduct a live, over-the-shoulder test of the Company Brain platform onboarding with Mitch Amos.","low","blocked","Jul 14",1,1],
[45363,"Review document tracker demo prototype","Scout Underwood requested feedback on a newly built document tracker prototype designed to automate workflow and improve traceability.","none","ai","Nov 3",0,1],
[26081,"Roll out company intelligence platform and collect user feedback","Scout Underwood announced the upcoming rollout of the company platform within the next couple of days to facilitate team testing and feedback collection.","low","handled","Aug 26",1,1],
[15529,"Evaluate Persistent Chat Memory","Duc Huy Tran requested that the platform retain chat history across sessions to prevent loss of context.","none","ai","Aug 12",1,1]
].map(r=>({id:r[0],title:r[1],desc:r[2],p:r[3],s:r[4],seen:r[5],canP:!!r[6],canD:!!r[7],official:false,gone:false}));
const byId=id=>T.find(t=>t.id===+id);

const S={view:"kanban",q:"",shut:{},open:{},sel:null,filter:false};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ── Rail ── */
const NAV=[
 ["h","Dashboard views"],["zap","Me","on"],["swap","Work Package","","down"],["bldg","The Business","off","lock"],["clock","Daily Pulse","","0/16"],
 ["h","Launchpad"],["dot","Jira","sm","ext"],["table","Smartsheet","sm","ext"],["mail","Gmail","sm","ext"],["drive","Google Drive","sm","ext"],["plus","Add folder","add"],
 ["h","Discovery"],["org","Org Chart"],["layers","Group Knowledge"],["shield","Due Diligence"],["flow","TRL Accelerator (Proj. 2)","off","clock"],["book","Tutorial"]
];
$("#nav").innerHTML=NAV.map(n=>{
  if(n[0]==="h")return `<h6>${n[1]}</h6>`;
  const tail=!n[3]?"":/\d/.test(n[3])?`<b class="cnt">${n[3]}</b>`:ic(n[3],"tail");
  const on=n[2]==="on";
  return `<button class="ni ${n[2]||""}" title="${esc(n[1])}" ${on?'aria-current="page"':`data-act="stub" data-n="${esc(n[1])}"`}>${ic(n[0])}<span>${esc(n[1])}</span>${tail}</button>`;
}).join("");

/* ── Shared pieces ── */
const visible=()=>{const q=S.q.trim().toLowerCase();return T.filter(t=>!t.gone&&(!q||(t.title+" "+t.desc+" #"+t.id).toLowerCase().includes(q)))};
const mark=t=>t.official?ic("verified","c-green"):ic("spark","c-amber");
function pill(t){
  const p=PM[t.p];const cls=t.p==="low"?" low":t.p==="none"?" none":"";
  return `<button class="pill${cls}" data-act="sev" data-id="${t.id}" aria-haspopup="true">${t.p==="none"?"Set severity":esc(p.sev)}${ic("down")}</button>`;
}

/* ── Cards view ── */
function cardsView(list){
  if(!list.length)return `<div class="none-msg">No tasks match this filter.</div>`;
  return P.map(p=>{
    const items=list.filter(t=>t.p===p.k);
    if(!items.length)return "";
    return `<section class="grp"><div class="grp-h"><h2 class="${p.k==="critical"?"hot":""}">${esc(p.group)}</h2><span class="n">${items.length}</span><i></i></div>`+
      items.map(t=>{
        const open=!!S.open[t.id];
        return `<article class="sig p-${t.p}${t.official?" official":""}">
  <div class="sig-top">
    <div class="sig-t"><span class="type">task</span><h3>${esc(t.title)}</h3></div>
    <div class="acts">
      <button class="btn" data-act="promote" data-id="${t.id}" ${t.canP&&!t.official?"":"disabled"}>${t.official?"Promoted":"Promote"}</button>
      <button class="btn" data-act="dismiss" data-id="${t.id}" ${t.canD?"":"disabled"}>Dismiss</button>
      <button class="btn dots" data-act="menu" data-id="${t.id}" aria-label="Move ${esc(t.title)}" aria-haspopup="true">···</button>
    </div>
  </div>
  <p>${esc(t.desc)} <button class="more" data-act="details" data-id="${t.id}">(${open?"less":"more"})</button></p>
  <div class="meta">${mark(t)}${pill(t)}<span>seen ${t.seen}</span></div>
  ${open?`<dl class="dl"><div><dt>Priority row</dt><dd>${esc(p.name)}</dd></div><div><dt>Workflow status</dt><dd>${SM[t.s]}</dd></div><div><dt>Verification</dt><dd>${t.official?"Human verified":"AI suggested"}</dd></div><div><dt>First seen</dt><dd>${t.seen}</dd></div></dl>`:""}
  <div class="sig-foot"><button class="det" data-act="details" data-id="${t.id}" aria-expanded="${open}">${ic("down")}Details</button><span class="id">#${t.id}</span></div>
</article>`;}).join("")+`</section>`;
  }).join("");
}

/* ── Kanban view ── */
function kanbanView(list){
  let h=`<div class="kb-top"><span class="eyebrow">Workspace workflow</span><span class="kb-hint">Drag a card across columns to change its status, or across rows to change its priority.</span></div>
<div class="track"><button data-act="pan" data-d="-1" id="pan-l" aria-label="Show previous columns">${ic("left")}</button><div class="t" role="scrollbar" aria-label="Board horizontal scroll position" aria-controls="board" aria-valuenow="0"><i id="thumb"></i></div><button data-act="pan" data-d="1" id="pan-r" aria-label="Show next columns">${ic("right")}</button></div>
<div class="board" id="board" role="region" aria-label="Work status board by priority. Scroll horizontally to view additional columns." tabindex="0"><div class="board-in">
<div class="cols">${ST.map(([k,n])=>`<div class="col-h"><h2>${n}</h2><span class="n">${list.filter(t=>t.s===k).length}</span></div>`).join("")}</div>`;
  P.forEach(p=>{
    const items=list.filter(t=>t.p===p.k),shut=!!S.shut[p.k];
    h+=`<section class="lane lane-${p.k} p-${p.k}${shut?" shut":""}" aria-label="${p.name}">
<div class="lane-head"><button class="lane-toggle" data-act="lane" data-k="${p.k}" aria-expanded="${!shut}">${ic("down")}<i class="lane-dot"></i><span class="lane-name">${p.name}</span><span class="lane-n">${items.length}</span><span class="lane-sev">${esc(p.sev)}</span></button><i class="lane-rule"></i></div>`;
    if(!shut)h+=`<div class="cells">${ST.map(([k,n])=>{
      const cs=items.filter(t=>t.s===k);
      return `<div class="cell" data-p="${p.k}" data-s="${k}" aria-label="${p.name}, ${n}">${cs.length?cs.map(kcard).join(""):`<div class="empty">No items</div>`}</div>`;
    }).join("")}</div>`;
    h+=`</section>`;
  });
  return h+`</div></div>`;
}
const kcard=t=>`<article class="kc p-${t.p}${t.official?" official":""}" draggable="true" tabindex="0" role="button" data-act="open" data-id="${t.id}" aria-label="${esc(t.title)}. Open details">
<div class="kc-top"><span class="type">task</span>${mark(t)}<span class="sp"></span>${ic("grip")}</div>
<h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p>
<footer><span>seen ${t.seen}</span><span class="id">#${t.id}</span></footer></article>`;

/* ── Drawer ── */
function drawer(){
  const t=S.sel&&byId(S.sel);
  if(!t||t.gone){$("#layer").innerHTML="";return}
  $("#layer").innerHTML=`<div class="scrim" data-act="close"></div>
<aside class="drawer" role="dialog" aria-label="Task details">
  <div class="dr-top"><span class="type">task</span><span class="id">#${t.id}</span><span class="sp"></span><button class="x" data-act="close" aria-label="Close details">${ic("x")}</button></div>
  <h2>${esc(t.title)}</h2><p>${esc(t.desc)}</p>
  <div class="fld"><h6>Priority</h6><div class="chips">${P.map(p=>`<button class="ch p-${p.k}" data-act="setp" data-id="${t.id}" data-k="${p.k}" aria-pressed="${t.p===p.k}"><i class="lane-dot"></i>${p.name}</button>`).join("")}</div></div>
  <div class="fld"><h6>Workflow status</h6><div class="chips">${ST.map(([k,n])=>`<button class="ch" data-act="sets" data-id="${t.id}" data-k="${k}" aria-pressed="${t.s===k}">${n}</button>`).join("")}</div></div>
  <div class="dr-meta"><span>${mark(t)}${t.official?"Human verified":"AI suggested"}</span><span>${esc(PM[t.p].sev)}</span><span>seen ${t.seen}</span></div>
  <div class="dr-acts"><button class="btn" data-act="promote" data-id="${t.id}" ${t.canP&&!t.official?"":"disabled"}>${t.official?"Promoted":"Promote"}</button><button class="btn" data-act="dismiss" data-id="${t.id}" ${t.canD?"":"disabled"}>Dismiss</button></div>
</aside>`;
}

/* ── Render ── */
function render(){
  const list=visible(),b=$("#board"),pos=b?[b.scrollLeft,b.scrollTop]:null;
  const off=T.filter(t=>t.official&&!t.gone).length,gone=T.filter(t=>t.gone).length;
  $("#counts").innerHTML=`<b>${off} official</b> · ${TOTAL-off-gone} suggested`;
  $("#inview").textContent=`${list.length} of ${TOTAL-gone} in view`;
  $("#app").classList.toggle("kb",S.view==="kanban");
  $("#v-cards").setAttribute("aria-pressed",S.view==="cards");
  $("#v-kanban").setAttribute("aria-pressed",S.view==="kanban");
  $("#view").innerHTML=S.view==="kanban"?kanbanView(list):cardsView(list);
  const nb=$("#board");
  if(nb){if(pos){nb.scrollLeft=pos[0];nb.scrollTop=pos[1]}nb.addEventListener("scroll",thumb,{passive:true});thumb()}
  drawer();
}
function thumb(){
  const b=$("#board"),th=$("#thumb");if(!b||!th)return;
  const w=b.scrollWidth,c=b.clientWidth,x=b.scrollLeft;
  th.closest(".track").hidden=w<=c+1;
  th.style.width=Math.min(100,c/w*100)+"%";th.style.left=(x/w*100)+"%";
  $("#pan-l").disabled=x<=1;$("#pan-r").disabled=x+c>=w-1;
}
addEventListener("resize",thumb);

/* ── Toast + popover ── */
let toastT;
function toast(msg,undo){
  document.querySelector(".toast")?.remove();
  const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");
  el.innerHTML=`<span>${esc(msg)}</span>`;
  if(undo){const u=document.createElement("button");u.textContent="Undo";u.onclick=()=>{undo();el.remove();render()};el.appendChild(u)}
  document.querySelector(".main").appendChild(el);
  clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),undo?6000:2600);
}
const pop=$("#pop");
function showPop(anchor,cls,html){
  pop.className="pop "+cls;pop.innerHTML=html;pop.hidden=false;
  const r=anchor.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
  let x=Math.min(r.left,innerWidth-w-12),y=r.bottom+6;
  if(y+h>innerHeight-12)y=Math.max(12,r.top-h-6);
  pop.style.left=Math.max(12,x)+"px";pop.style.top=y+"px";
}
const hidePop=()=>{pop.hidden=true};
function sevPop(a,t){
  const p=PM[t.p],set=t.p!=="none";
  const o=(ax,val,label)=>`<button class="opt${set&&p[ax]===val?" on":""}" data-act="axis" data-id="${t.id}" data-ax="${ax}" data-val="${val}">${label}</button>`;
  showPop(a,"",`<h5>Severity · set both axes</h5><div class="axes"><div><h6>Urgency</h6>${o("u",1,"Urgent")}</div><div><h6>Impact</h6>${o("i",1,"High impact")}</div><div>${o("u",0,"Not urgent")}</div><div>${o("i",0,"Low impact")}</div></div><div class="cur">Current: <b>${esc(p.sev)}</b> → row <b>${p.name}</b></div>`);
}
function move(t,p,s,quiet){
  const from={p:t.p,s:t.s};if(from.p===p&&from.s===s)return;
  t.p=p;t.s=s;
  const parts=[];if(from.s!==s)parts.push(SM[s]);if(from.p!==p)parts.push(PM[p].name);
  if(!quiet)toast(`#${t.id} moved to ${parts.join(" · ")}`,()=>{t.p=from.p;t.s=from.s});
  render();
}
function setView(v,push){
  S.view=v==="cards"?"cards":"kanban";store.set("hs-view",S.view);
  if(push){try{history.replaceState(null,"","#"+S.view)}catch(e){location.hash=S.view}}
  render();
}

/* ── Events ── */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(!a){if(!e.target.closest("#pop"))hidePop();return}
  const act=a.dataset.act,t=a.dataset.id?byId(a.dataset.id):null;
  if(!a.closest("#pop")&&!["sev","menu","notes"].includes(act))hidePop();
  switch(act){
    case"view":setView(a.dataset.v,true);break;
    case"mini":{const m=$("#app").classList.toggle("mini");a.setAttribute("aria-label",m?"Expand sidebar":"Collapse sidebar");setTimeout(thumb,0);break}
    case"stub":toast(`${a.dataset.n} is outside this prototype`);break;
    case"sync":toast("Sync started. Prototype data stays as is.");break;
    case"filter":S.filter=!S.filter;$("#search").hidden=!S.filter;a.classList.toggle("on",S.filter);a.setAttribute("aria-expanded",S.filter);if(S.filter)$("#q").focus();else{S.q="";$("#q").value="";render()}break;
    case"lane":S.shut[a.dataset.k]=!S.shut[a.dataset.k];render();break;
    case"pan":{const b=$("#board"),step=parseFloat(getComputedStyle(b.querySelector(".col-h")).width)+12;b.scrollBy({left:step*a.dataset.d,behavior:"smooth"});break}
    case"details":S.open[t.id]=!S.open[t.id];render();break;
    case"promote":t.official=true;toast(`#${t.id} promoted to official`,()=>{t.official=false});render();break;
    case"dismiss":t.gone=true;if(S.sel===t.id)S.sel=null;toast(`#${t.id} dismissed`,()=>{t.gone=false});render();break;
    case"open":S.sel=t.id;drawer();document.querySelector(".drawer .x")?.focus();break;
    case"close":S.sel=null;drawer();break;
    case"setp":move(t,a.dataset.k,t.s);break;
    case"sets":move(t,t.p,a.dataset.k);hidePop();break;
    case"sev":e.stopPropagation();sevPop(a,t);break;
    case"axis":{const cur=PM[t.p],u=a.dataset.ax==="u"?+a.dataset.val:(t.p==="none"?0:cur.u),i=a.dataset.ax==="i"?+a.dataset.val:(t.p==="none"?0:cur.i);
      const np=P.find(p=>p.u===u&&p.i===i);hidePop();move(t,np.k,t.s);break}
    case"menu":showPop(a,"menu",`<h6>Move to</h6>`+ST.map(([k,n])=>`<button class="mi${t.s===k?" on":""}" data-act="sets" data-id="${t.id}" data-k="${k}">${n}</button>`).join(""));break;
    case"notes":showPop(a,"note",`<h5>Prototype notes</h5><p>Kanban rows come from the severity already on each task. No new field is needed.</p><table><tr><td>Critical</td><td>Urgent · High impact</td></tr><tr><td>High priority</td><td>Not urgent · High impact</td></tr><tr><td>Medium priority</td><td>Urgent · Low impact</td></tr><tr><td>Low priority</td><td>Not urgent · Low impact</td></tr><tr><td>No priority</td><td>Severity not set</td></tr></table><p>Columns reuse the Junkola workspace workflow. Task titles and severities are the 20 in the Me view. Workflow statuses, and the two tasks without a severity, are sample values.</p>`);break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!pop.hidden)hidePop();else if(S.sel){S.sel=null;drawer()}}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList?.contains("kc")){e.preventDefault();e.target.click()}
});
$("#q").addEventListener("input",e=>{S.q=e.target.value;render()});
document.querySelector(".scroll").addEventListener("scroll",hidePop,{passive:true});

// Drag and drop between cells: column sets status, row sets priority.
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest?.(".kc");if(!c)return;dragId=c.dataset.id;c.classList.add("drag");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(x){}});
document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".drag,.over").forEach(n=>n.classList.remove("drag","over"))});
document.addEventListener("dragover",e=>{const c=e.target.closest?.(".cell");if(!c||!dragId)return;e.preventDefault();e.dataTransfer.dropEffect="move";
  if(!c.classList.contains("over")){document.querySelectorAll(".cell.over").forEach(n=>n.classList.remove("over"));c.classList.add("over")}});
document.addEventListener("drop",e=>{const c=e.target.closest?.(".cell");if(!c||!dragId)return;e.preventDefault();const t=byId(dragId);dragId=null;if(t)move(t,c.dataset.p,c.dataset.s)});

function fromHash(){const h=location.hash.slice(1);if(h==="cards"||h==="kanban"){S.view=h;render()}}
addEventListener("hashchange",fromHash);
const h0=location.hash.slice(1),saved=store.get("hs-view");
S.view=h0==="cards"||h0==="kanban"?h0:saved==="cards"?"cards":"kanban";
if(innerWidth<760)$("#app").classList.add("mini");
render();
})();
</script>
</body>
</html>
