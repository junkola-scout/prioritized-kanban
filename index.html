<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperspace Insights Kanban</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: PLANA Hyperspace app shell (236px rail + header + tab bars) with the Insights
   body shown as a workflow board cut into priority rows, or as a timeline of rows by seen date. */
:root{
  color-scheme:dark;
  --bg:#0c0c0d; --bar:rgba(12,12,13,.95);
  --surface:#1a1a1c; --surface-2:#232326; --surface-3:#2c2c2f;
  --line:#39383b; --line-2:#555459; --line-3:#454247;
  --fg:#ffffff; --muted:#aaa9ae; --dim:#7d7c81; --off:#77767b;
  --orange:#e56203; --orange-hi:#f18a42; --red:#e50602; --coral:#ff6b69; --amber:#f4ba78; --green:#4cc38a;
  --card-bg:linear-gradient(#1e1e21,#1a1a1c 55%,#18181a);
  --hot:linear-gradient(90deg,#e50602,#e53b02);
  --font:"Google Sans","Google Sans Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --col:minmax(170px,1fr); --minw:1068px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--font);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:flex;height:100%;background:radial-gradient(2100px 830px at 55% 122%,rgba(229,6,2,.34),rgba(229,98,3,.13) 34%,rgba(0,0,0,0) 70%),var(--bg)}

/* ── Left rail ── */
.rail-nav{width:236px;flex:none;display:flex;flex-direction:column;background:linear-gradient(#1d1d20,#1a1a1c 30%,#161618);border-right:1px solid var(--line);min-height:0}
.brand{position:relative;padding:18px 16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:73px}
.logo{display:flex;align-items:center;gap:7px;color:var(--fg)}
.logo svg{width:26px;height:26px;flex:none}
.logo-w{display:flex;flex-direction:column;line-height:1}
.logo-w b{font-weight:500;font-size:21px;letter-spacing:.2em;transform:scaleX(1.12);transform-origin:left}
.logo-w i{font-size:7.5px;letter-spacing:.34em;margin-top:3px;border-top:1px solid var(--fg);padding-top:2px;font-weight:500}
.logo-w em{font-style:normal;font-size:6.5px;font-weight:800;letter-spacing:.14em;color:var(--orange);align-self:flex-end;margin-top:1px}
.collapse{position:absolute;top:7px;right:8px;width:28px;height:28px;display:grid;place-items:center;color:var(--muted);border-radius:6px}
.collapse:hover{color:var(--fg);background:var(--surface-2)}
.nav{flex:1;overflow-y:auto;padding:14px 10px;min-height:0}
.nav h6{margin:0;padding:9px 8px 5px;font:800 10px/15px var(--font);letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.nav h6:not(:first-child){margin-top:4px}
.ni{display:flex;align-items:center;gap:9px;width:100%;height:37px;padding:8px 10px;border-radius:7px;font-size:14px;color:var(--fg);white-space:nowrap}
.ni svg.ic{width:17px;height:17px;color:var(--muted)}
.ni span{flex:1;overflow:hidden;text-overflow:ellipsis}
.ni:hover{background:rgba(255,255,255,.05)}
.ni.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--orange)}
.ni.on svg.ic:first-child{color:var(--fg)}
.ni.off{color:var(--dim)} .ni.off svg.ic{color:var(--dim)}
.ni .tail{width:13px;height:13px;color:var(--dim)}
.ni .cnt{flex:none;font:800 10px/15px var(--font);color:var(--orange)}
.ni.sm{height:36px}
.ni.add{height:30px;padding-left:32px;color:var(--dim);font-size:13.5px}
.ni.add svg.ic{width:14px;height:14px;color:var(--dim)}
.rail-foot{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.fbtn{height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;padding:0 12px;white-space:nowrap}
.fbtn.pri{background:var(--orange);border:1px solid var(--orange-hi);font-weight:700}
.fbtn.sec{background:var(--surface);border:1px solid var(--line-2)}
.fbtn.sec:hover{border-color:var(--muted)}
.me{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;min-width:0}
.me:hover{background:rgba(255,255,255,.05)}
.av{width:32px;height:32px;flex:none;border-radius:50%;background:#414042;display:grid;place-items:center;font:800 12px var(--font)}
.me-t{flex:1;min-width:0;display:flex;flex-direction:column}
.me-t b{font-weight:600;font-size:13px;line-height:20px}
.me-t small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me>svg.ic{color:var(--muted);width:14px;height:14px}

.app.mini .rail-nav{width:58px}
.app.mini .logo-w,.app.mini .nav h6,.app.mini .ni span,.app.mini .ni .tail,.app.mini .ni .cnt,.app.mini .ni.add,.app.mini .fbtn span,.app.mini .me-t,.app.mini .me>svg.ic{display:none}
.app.mini .brand{padding:18px 0 14px;justify-content:center;flex-direction:column;gap:6px}
.app.mini .collapse{position:static;transform:rotate(180deg)}
.app.mini .nav{padding:14px 9px}
.app.mini .ni{justify-content:center;padding:8px 0}
.app.mini .rail-foot{padding:12px 9px}
.app.mini .fbtn{padding:0}
.app.mini .me{padding:4px;justify-content:center}

/* ── Main column ── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{flex:none;height:57px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--bar);display:flex;align-items:center;justify-content:flex-end;gap:14px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--orange);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.syncbtn{height:36px;padding:0 10px;border-radius:7px;border:1px solid var(--orange);background:var(--surface);color:var(--orange);font-size:12px;font-weight:500;white-space:nowrap}
.syncbtn:hover{background:rgba(229,98,3,.12)}
.sq{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center}
.sq svg{width:20px;height:20px}
.bar{flex:none;padding:8px 24px;border-bottom:1px solid var(--line);background:var(--bar);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.tab{flex:none;padding:7px 12px;border-radius:7px;font-size:13px;line-height:20px;color:var(--muted);display:flex;align-items:center;gap:7px;position:relative;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);font-weight:700}
.tab.line.on::after{content:"";position:absolute;left:12px;right:12px;bottom:1px;height:2px;border-radius:2px;background:var(--orange)}
.tab.sub.on{background:#fff;color:#000}
.badge{font:800 11px/17px var(--font);padding:1px 7px;border-radius:100px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.badge.hot{background:linear-gradient(120deg,#e50602,#e56203 140%);color:#fff}
.tab.sub.on .badge{background:rgba(0,0,0,.1);color:#000}

.scroll{flex:1;min-height:0;overflow-y:auto}
.wrap{max-width:1500px;margin:0 auto;padding:20px 24px 80px;display:flex;gap:24px;align-items:flex-start}
.filterbtn{width:40px;height:40px;flex:none;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.filterbtn:hover,.filterbtn.on{color:var(--fg);border-color:var(--muted)}
.body{flex:1;min-width:0}
.app.kb .wrap{height:100%;padding-bottom:16px;max-width:none}
.app.kb .body{height:100%;display:flex;flex-direction:column;min-height:560px}

.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:36px}
.hd h1{margin:0;font:400 20px/30px var(--font);letter-spacing:-.4px}
.hd .counts{font-size:12px;color:var(--muted)} .hd .counts b{color:var(--fg);font-weight:600}
.hd .sp{flex:1}
.gear{width:36px;height:36px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.gear:hover{border-color:var(--line-2)}
.legend{display:flex;justify-content:flex-end;gap:12px;font-size:11px;color:var(--dim);margin-top:10px;min-height:17px;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend svg.ic{width:12px;height:12px}
.c-green{color:var(--green)} .c-amber{color:var(--amber)}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--muted);max-width:420px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:400 13px var(--font)}
.search input::placeholder{color:var(--dim)}
.active{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:0 0 10px;min-height:22px}
.active .lb{font-weight:600;letter-spacing:.07em}
.active .chip{border:1px solid var(--orange);color:var(--orange);font-weight:600;padding:1px 10px;border-radius:100px;line-height:18px}
.active b{font-weight:600}
.active .sp{flex:1}
.notes{display:flex;align-items:center;gap:6px;border:1px dashed var(--line-2);border-radius:100px;padding:1px 10px;line-height:18px;color:var(--muted)}
.notes:hover{color:var(--fg);border-color:var(--muted)}
.notes svg.ic{width:12px;height:12px}

/* ── Card pieces shared by the board and the edit dialog ── */
.kc::before,.lr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar-c,transparent)}
.p-critical{--bar-c:linear-gradient(#e50602,#e56203)} .p-high{--bar-c:var(--orange)} .p-medium{--bar-c:var(--amber)} .p-low{--bar-c:var(--line-2)} .p-none{--bar-c:transparent} .p-pinned{--bar-c:var(--fg)}
.type{flex:none;font:800 9px/22px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:2px;padding:0 6px}
.btn{height:31px;padding:0 12px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{color:var(--off);background:var(--surface-3);border-color:#38383c}
.btn.dots{width:31px;padding:0;background:none;border-color:var(--line-3);color:var(--muted);letter-spacing:1px;text-align:center;font-weight:500}
.more{color:var(--orange);font-size:13.5px}
.meta{display:flex;align-items:center;gap:8px;margin-top:24px;font-size:12px;color:var(--muted);min-height:24px;flex-wrap:wrap}
.meta>svg.ic{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 12px;border-radius:8px;font:700 12px/18px var(--font);color:#fff;background:var(--hot);border:1px solid transparent;white-space:nowrap}
.pill svg.ic{width:13px;height:13px;stroke-width:2.4}
.pill.low{background:none;color:var(--muted);border-color:var(--line-2)}
.pill.none{background:none;color:var(--dim);border:1px dashed var(--line-2)}
.id{font:400 12px/16px var(--mono);letter-spacing:.1em;color:var(--dim)}
.dd{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:168px;height:31px;padding:0 9px 0 12px;border:1px solid var(--line-2);border-radius:6px;background:rgba(229,98,3,.14);color:var(--amber);font-size:12.5px;font-weight:500;white-space:nowrap}
.dd:hover{border-color:var(--muted)}
.dd svg.ic{width:14px;height:14px}
.dt{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;font-size:12.5px}
.dt-row{display:flex;gap:10px 20px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.dt-mem{display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;min-width:0}
.chan{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:6px;padding:2px 9px;font-weight:700;font-size:11.5px;color:var(--fg);white-space:nowrap}
.chan svg.ic{width:13px;height:13px}
.dt-src{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap}
.pct{font-weight:800;font-size:11px;color:var(--fg)}
.src{color:var(--orange);font-size:12px;display:inline-flex;gap:5px;align-items:center} .src svg.ic{width:11px;height:11px}
.dt-grid{display:grid;grid-template-columns:minmax(190px,1fr) 1.5fr 1.5fr;gap:16px 28px;padding-top:12px;border-top:1px solid var(--line)}
.dt-grid h6,.modal h6,.modal .h6{margin:0 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:800 9.5px/14px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.dt-grid h6 svg.ic,.modal .h6 svg.ic,.modal h6 svg.ic{width:12px;height:12px}
.dt-grid p{margin:0;font-size:13.5px;line-height:21px;color:var(--fg)}
.edl{color:var(--amber);font-weight:700;font-size:10px;letter-spacing:.02em;text-transform:none}
.edl:hover{text-decoration:underline}
.raci{margin:0;display:grid;gap:6px}
.raci>div{display:grid;grid-template-columns:18px 84px 1fr;gap:8px;align-items:center}
.raci b{width:17px;height:17px;border:1px solid var(--line-2);border-radius:3px;display:grid;place-items:center;font-size:9px;font-weight:800}
.raci dt{font-size:11px;color:var(--dim)} .raci dd{margin:0;font-size:13px;min-width:0}
.dt-acts{display:flex;gap:6px;flex-wrap:wrap}
.dt-kb{font-size:12px}
.dt-kb .dt-row{flex-direction:column;align-items:stretch}
.dt-kb .dt-grid{grid-template-columns:1fr;gap:12px}
.dt-kb .dt-grid p{font-size:12px;line-height:17px}
.dt-kb .raci>div{grid-template-columns:18px 1fr} .dt-kb .raci dt{display:none} .dt-kb .raci dd{font-size:12px}
.dt-kb .dd{width:100%;min-width:0}
.dt-kb .btn{height:28px;padding:0 10px;font-size:12px}
@media (max-width:900px){.dt-grid{grid-template-columns:1fr}}
.btn.hot{background:var(--orange);border-color:var(--orange-hi);font-weight:700}
.btn.hot:disabled{background:var(--surface-3);border-color:#38383c;font-weight:400}
.none-msg{border:1px dashed var(--line);border-radius:10px;padding:36px 16px;text-align:center;color:var(--dim);font-size:13px}

.type.tdd{display:inline-flex;align-items:center;gap:3px;padding:0 4px 0 6px;cursor:pointer}
.type.tdd:hover,.type.tdd[aria-expanded="true"]{border-color:var(--muted);color:var(--fg)}
.type.tdd svg.ic{width:10px;height:10px;margin:0;stroke-width:2.4}
.kindnote{border:1px dashed var(--line-2);border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.pdd{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 8px 0 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);font-size:12.5px;font-weight:600;white-space:nowrap}
.pdd:hover{border-color:var(--muted)} .pdd svg.ic{width:13px;height:13px;color:var(--muted)}
.lr-side .pdd{min-width:150px} .lr-side .pdd svg.ic{margin-left:auto}
/* ── Manual signal creation ── */
.newbtn{height:36px;display:inline-flex;align-items:center;gap:6px;font-size:13px} .newbtn svg.ic{width:14px;height:14px;stroke-width:2.4}
.addc{display:flex;align-items:center;justify-content:center;gap:5px;min-height:26px;border:1px dashed var(--line);border-radius:7px;font-size:11px;color:var(--dim)}
.addc svg.ic{width:12px;height:12px}
.addc:hover,.addc:focus-visible{border-color:var(--orange);color:var(--amber);background:rgba(229,98,3,.08)}
.addc.solo{flex:1;min-height:46px}
.addc.solo svg.ic,.addc.solo .lbl-add{display:none}
.addc.solo:hover svg.ic,.addc.solo:focus-visible svg.ic{display:block}
.addc.solo:hover .lbl-add,.addc.solo:focus-visible .lbl-add{display:inline}
.addc.solo:hover .lbl-none,.addc.solo:focus-visible .lbl-none{display:none}
@media (hover:hover){.addc:not(.solo){opacity:0;transition:opacity .12s}.cell:hover .addc,.addc:focus-visible{opacity:1}}
@media (hover:none){.addc.solo .lbl-none{display:none}.addc.solo .lbl-add{display:inline}.addc.solo svg.ic{display:block}}
.modal small.err{color:var(--coral);font-style:normal}
/* ── Dismissed tray ── */
.tray{flex:none;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:rgba(22,22,24,.92)}
.tray-bar{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border-radius:10px;outline:1px dashed transparent;outline-offset:-1px}
.tray-bar:hover{background:rgba(255,255,255,.04)}
.tray-bar.over{outline-color:var(--orange);background:rgba(229,98,3,.12)}
.tray-bar>svg.ic{width:14px;height:14px;color:var(--dim);transform:rotate(-90deg)} .tray.open .tray-bar>svg.ic{transform:none}
.tray .lane-name{color:var(--muted)}
.tray-list{max-height:190px;overflow:auto;padding:0 76px 8px 8px;display:flex;flex-direction:column;gap:4px}
.tr{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;border:1px solid #2a2a2d;font-size:12.5px}
.tr b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tr-m{color:var(--dim);font-size:11.5px;white-space:nowrap} .tr .btn{height:26px;font-size:12px}
.dd.gone{background:var(--surface);color:var(--muted)} .lr.gone{opacity:.62}
@media (max-width:760px){.tr-m{display:none}.tray-list{padding-right:8px}.tray{margin-bottom:64px}}
/* ── View switch ── */
.seg{display:flex;height:36px;border:1px solid var(--line);border-radius:7px;background:var(--surface);overflow:hidden}
.seg button{display:flex;align-items:center;gap:7px;padding:0 12px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:rgba(229,98,3,.14);color:var(--amber)}
.rchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--orange);color:var(--amber);border-radius:100px;padding:1px 5px 1px 10px;line-height:18px;font-weight:600}
.rchip button{display:grid;place-items:center;width:16px;height:16px;border-radius:50%}
.rchip button:hover{background:rgba(229,98,3,.25)} .rchip svg.ic{width:11px;height:11px}

/* ── Timeline list ── */
.lv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.lv-bar .sp{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-size:12.5px;white-space:nowrap}
.tbtn:hover{border-color:var(--muted)}
.tbtn.on{border-color:var(--orange);color:var(--amber);background:rgba(229,98,3,.14)}
.tbtn svg.ic{width:14px;height:14px}
.lv{display:flex;flex-direction:column;gap:24px}
.lr{position:relative;overflow:hidden;border:1px dashed var(--line-2);border-radius:10px;background:var(--card-bg);padding:12px 16px 12px 18px}
.lr.official{border-style:solid}
.lr-main{display:grid;grid-template-columns:70px minmax(0,1fr) auto auto;gap:10px 18px;align-items:start}
.lr-date{display:flex;flex-direction:column;gap:2px;line-height:1.2}
.lr-date b{font-size:14px;font-weight:700;white-space:nowrap}
.lr-date small{font:400 11px var(--mono);color:var(--dim);letter-spacing:.08em}
.lr-t{display:flex;align-items:flex-start;gap:8px} .lr-t>svg.ic{width:13px;height:13px;margin-top:5px}
.lr h3{margin:0;font:700 16px/1.35 var(--font);letter-spacing:-.01em;min-width:0}
.lr h3 button{font:inherit;letter-spacing:inherit;text-align:left}
.lr h3 button:hover{text-decoration:underline;text-decoration-color:var(--orange)}

29665:["Mitch Amos·Scout Underwood·Vu Pham","Google Chat",95,"E-081226-0534-013-C","Vu","Vu","Scout","Mitch",90,"Users may experience stale data across workspace integrations if automated and manual synchronization jobs fail to initialize.",90,"Investigate backend sync worker logs to determine why the 20 sync jobs failed to start and deploy a fix.","On August 12, 2026, Scout Underwood posted a bug report in the Brain Bugs Google Chat space addressing Vu Pham. An attached screenshot indicated that when clicking the Sync Now button, four sync jobs started while 20 failed to start. This task tracks the necessary technical investigation and resolution of the sync startup failure."],

45519:["Scout Underwood·Vu Pham·jacob@plana.aero·Duc Huy Tran","Gmail",95,"E-110926-0854-021-E","Vu","Scout","Jacob · Duc","—",90,"Providing detailed technical and data governance clarity will allow leadership to make informed decisions regarding Hyperspace adoption and website infrastructure.",95,"Vu Pham drafts technical responses addressing the four questions on hosting, data retention, portability, and commercial dependency, and sends them to Scout Underwood.","On November 9, 2026, Scout Underwood forwarded an email inquiry from PLANA COO Jacob Cho directly to Vu Pham. Jacob raised four detailed questions regarding Hyperspace following a recent webinar: cloud hosting location and infrastructure account ownership, data ingestion and retention policies for proprietary engineering files, portability of AI workflows and agents, and vendor dependency and commercial overlap with Google Workspace Gemini. Scout designated Vu as the best person to address these matters. This item was classified as a task because Scout issued a direct work request to Vu requiring a technical response. The recommended next step is for Vu Pham to draft clear responses addressing each architectural point and submit them to Scout to facilitate upcoming website infrastructure planning."],

15555:["Duc Huy Tran·Vu Pham·Scout Underwood","Gmail",5,"E-081226-1605-022-E","Scout","Scout","Vu","Duc",5,"If the platform continues to selectively filter sources based on phrasing, users will miss important information during broad queries.",5,"Modify the platform's search routing logic to query all relevant sources when a user asks a broad question, rather than prematurely filtering by tool.","Duc Huy Tran observed that the platform's AI selectively chooses data sources (like calendar vs. workspace) based on the specific phrasing of a user's prompt. For instance, asking for a 'day by day' breakdown caused the system to only read transcripts and ignore emails, leading to missed information. Duc requested that for broad questions, the platform should search across all relevant sources before determining what is useful. Scout Underwood acknowledged the feedback and added the requested change to the task list."],

const S={tray:false,showGone:false,kind:"action",view:"kanban",desc:true,range:null,cal:null,q:"",shut:{critical:true,high:true,medium:true,low:true,none:true},open:{},more:{},edit:null,filter:false};

/* ── Rail ── */
const NAV=[
 ["h","Dashboard views"],["zap","Me","on"],["swap","Work Package","","down"],["bldg","The Business","off","lock"],["clock","Daily Pulse","","0/16"],
 ["h","Launchpad"],["dot","Jira","sm","ext"],["table","Smartsheet","sm","ext"],["mail","Gmail","sm","ext"],["drive","Google Drive","sm","ext"],["plus","Add folder","add"],
 ["h","Discovery"],["org","Org Chart"],["layers","Group Knowledge"],["shield","Due Diligence"],["flow","TRL Accelerator (Proj. 2)","off","clock"],["book","Tutorial"]
];
$("#nav").innerHTML=NAV.map(n=>{
  if(n[0]==="h")return `<h6>${n[1]}</h6>`;
  const tail=!n[3]?"":/\d/.test(n[3])?`<b class="cnt">${n[3]}</b>`:ic(n[3],"tail");
  const on=n[2]==="on";
  return `<button class="ni ${n[2]||""}" title="${esc(n[1])}" ${on?'aria-current="page"':`data-act="stub" data-n="${esc(n[1])}"`}>${ic(n[0])}<span>${esc(n[1])}</span>${tail}</button>`;
}).join("");

/* ── Shared pieces ── */
const visible=()=>{const q=S.q.trim().toLowerCase();return T.filter(t=>!t.gone&&t.kind===S.kind&&inRange(t,S.range)&&(!q||(t.title+" "+t.desc+" #"+t.id).toLowerCase().includes(q)))};
const mark=t=>t.official||t.edited||t.verified?ic("verified","c-green"):ic("spark","c-amber");
// Signal types: key, badge label, tab label, total on the live workspace before any edits here.
const KINDS=[["action","Action","Actions",297],["risk","Risk","Risks",30],["decision","Decision","Decisions",18]];
const KM=Object.fromEntries(KINDS.map(k=>[k[0],k]));
// Every sample record starts as an action, so a tab's count moves only when a record changes type or is dismissed.
const kindTotal=k=>KM[k][3]+T.filter(t=>t.kind===k&&!t.gone).length-(k==="action"?SAMPLE_N:0);
const typeDD=t=>`<button class="type tdd" data-act="kind" data-id="${t.id}" aria-haspopup="true" aria-label="Signal type: ${KM[t.kind][1]}. Change type">${KM[t.kind][1]}${ic("down")}</button>`;
const CI={"Google Meet":"video","Gmail":"mail","Google Chat":"chat","Manual entry":"verified"};
const RN=["Responsible","Accountable","Consulted","Informed"];
const pct=n=>n==null?"":`<b class="pct">(${n}%)</b>`;
const edl=t=>`<button class="edl" data-act="edit" data-id="${t.id}">(edit)</button>`;
const stName=t=>t.gone?"Dismissed":SM[t.s];
const statusDD=t=>`<button class="dd${t.gone?" gone":""}" data-act="status" data-id="${t.id}" aria-haspopup="true" aria-label="Workflow status: ${stName(t)}">${stName(t)}${ic("down")}</button>`;
const pd=t=>`<button class="btn" data-act="promote" data-id="${t.id}" ${t.canP&&!t.official?"":"disabled"}>${t.official?"Promoted":"Promote"}</button><button class="btn" data-act="dismiss" data-id="${t.id}" ${t.canD?"":"disabled"}>Dismiss</button>`;
// The expanded Details block. Same fields in both views; the Kanban variant stacks them.
function detail(t,kb){
  return `<div class="dt${kb?" dt-kb":""}">
  <div class="dt-row"><div class="dt-mem"><span class="eyebrow">Members</span><span>${esc(t.mem.join(" · "))}</span><span class="chan">${ic(CI[t.chan]||"chat")}${esc(t.chan)}</span></div>${statusDD(t)}</div>
  <div class="dt-src">${t.manual?`<span class="tr-m">Created manually by ${esc(t.mem[0])} · ${fmt(t.date)}</span>`:`${pct(t.conf)}<button class="src" data-act="stub" data-n="Open source">Open source ${ic("ext")}</button><span class="id">${t.serial}</span>`}</div>
  <div class="dt-grid">
    <div><h6>RACI ${mark(t)} ${edl(t)}</h6><dl class="raci">${RN.map((n,i)=>`<div><b>${n[0]}</b><dt>${n}</dt><dd>${esc(t.raci[i])}</dd></div>`).join("")}</dl></div>
    <div><h6>Possible impact ${pct(t.piC)} ${mark(t)} ${edl(t)}</h6><p>${esc(t.pi||"—")}</p></div>
    <div><h6>Possible action ${pct(t.paC)} ${mark(t)} ${edl(t)}</h6><p>${esc(t.pa||"—")}</p></div>
  </div>
</div>`;
}
const summary=t=>!t.desc&&!t.ctx?"":`<p${S.more[t.id]?' class="full"':""}>${esc(t.desc)}${S.more[t.id]&&t.ctx?`<br><br>${esc(t.ctx)}`:""} <button class="more" data-act="more" data-id="${t.id}">(${S.more[t.id]?"less":"more"})</button></p>`;
// Priority drop-down for the places that have no rows to drag between: Timeline and the Edit dialog.
const pill=t=>{const r=rowOf(t);return `<button class="pdd p-${r}" data-act="prio" data-id="${t.id}" aria-haspopup="true" aria-label="Row: ${LM[r].name}. Change"><i class="lane-dot"></i>${LM[r].name}${ic("down")}</button>`};

/* ── Timeline view: one row per extraction, ordered by seen date ── */
function listView(list){
  const goneN=T.filter(t=>t.gone&&t.kind===S.kind).length;
  if(S.showGone)list=list.concat(T.filter(t=>t.gone&&t.kind===S.kind&&inRange(t,S.range)));
  const rows=[...list].sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:a.id-b.id)*(S.desc?-1:1));
  let h=`<div class="lv-bar"><span class="eyebrow">Insight extractions by date</span><span class="sp"></span>
<button class="tbtn${S.showGone?" on":""}" data-act="showgone" aria-pressed="${S.showGone}">${S.showGone?"Hide":"Show"} dismissed (${goneN})</button>
<button class="tbtn" data-act="sort" aria-label="Sorted ${S.desc?"newest":"oldest"} first. Switch to ${S.desc?"oldest":"newest"} first">${ic(S.desc?"newest":"oldest")}${S.desc?"Newest first":"Oldest first"}</button>
<button class="tbtn${S.range?" on":""}" data-act="cal" aria-haspopup="dialog">${ic("cal")}${S.range?esc(rangeLabel(S.range)):"Date range"}</button></div>`;
  if(!rows.length)return h+`<div class="none-msg">No extractions match${S.range?" this date range":" this filter"}.</div>`;
  return h+`<div class="lv" role="list">`+rows.map(t=>{
    const open=!!S.open[t.id],[md,y]=fmt(t.date).split(", ");
    return `<article class="lr p-${t.p}${t.official?" official":""}${t.gone?" gone":""}" role="listitem">
<div class="lr-main">
  <time class="lr-date" datetime="${t.date}"><b>${md}</b><small>${y}</small></time>
  <div class="lr-body"><div class="lr-t">${typeDD(t)}${mark(t)}<h3><button data-act="edit" data-id="${t.id}" title="Edit">${esc(t.title)}</button></h3></div>${summary(t)}</div>
  <div class="lr-side">${pill(t)}${statusDD(t)}</div>
  <div class="lr-end"><button class="kdots" data-act="menu" data-id="${t.id}" aria-label="More actions" aria-haspopup="true">···</button><span class="id">#${t.id}</span><button class="det" data-act="details" data-id="${t.id}" aria-expanded="${open}">${ic("down")}Details</button></div>
</div>${open?detail(t,false):""}
</article>`}).join("")+`</div>`;
}

/* ── Date range picker ── */
const HAS=()=>new Set(T.filter(t=>!t.gone).map(t=>t.date));
function calMonth(y,m,c,has){
  const first=new Date(Date.UTC(y,m,1)).getUTCDay(),n=new Date(Date.UTC(y,m+1,0)).getUTCDate(),a=c.a,b=c.b||c.a;
  let g="SMTWTFS".split("").map(d=>`<span class="wd">${d}</span>`).join("")+"<span></span>".repeat(first);
  for(let d=1;d<=n;d++){const i=iso(y,m,d),cl=[i===a?"a":"",i===b?"b":"",a&&i>a&&i<b?"in":"",i===TODAY?"today":"",has.has(i)?"has":""].filter(Boolean).join(" ");
    g+=`<button class="cd ${cl}" data-act="calday" data-d="${i}" aria-label="${fmt(i)}${has.has(i)?", has extractions":""}" aria-pressed="${i===a||i===b}">${d}</button>`}
  return `<div class="cal-m"><h3>${MONTHS[m]} ${y}</h3><div class="cal-g">${g}</div></div>`;
}
function calRender(){
  const c=S.cal;if(!c){$("#cal").innerHTML="";return}
  const y2=c.m===11?c.y+1:c.y,m2=(c.m+1)%12,has=HAS();
  const r=c.a?{from:c.a,to:c.b||c.a}:null,n=T.filter(t=>!t.gone&&inRange(t,r)).length;
  const pre=[["7","Last 7 days"],["30","Last 30 days"],["90","Last 90 days"],["year","This year"]];
  $("#cal").innerHTML=`<div class="scrim top" data-act="calcancel"></div>
<section class="calm" role="dialog" aria-modal="true" aria-label="Filter by date range">
  <div class="cal-h"><h2>Filter by date range</h2><button class="x" data-act="calcancel" aria-label="Close">${ic("x")}</button></div>
  <div class="cal-pre">${pre.map(([k,l])=>`<button class="ch" data-act="calpre" data-n="${k}">${l}</button>`).join("")}</div>
  <div class="cal-nav"><button data-act="calnav" data-d="-1" aria-label="Previous month">${ic("left")}</button><div class="cal-months">${calMonth(c.y,c.m,c,has)}${calMonth(y2,m2,c,has)}</div><button data-act="calnav" data-d="1" aria-label="Next month">${ic("right")}</button></div>
  <div class="cal-key"><i></i>Days with extractions</div>
  <div class="cal-f"><small>${r?`${esc(rangeLabel(r))} · ${n} extraction${n===1?"":"s"}`:"Pick a start date, then an end date."}${c.a&&!c.b?" Pick an end date, or apply for a single day.":""}</small><button class="btn" data-act="calclear">Clear</button><button class="btn" data-act="calcancel">Cancel</button><button class="btn hot" data-act="calapply" ${c.a?"":"disabled"}>Apply</button></div>
</section>`;
}
function calOpen(){
  const r=S.range,anchor=(r?r.to:[...HAS()].sort().pop()||TODAY).split("-").map(Number);
  let y=anchor[0],m=anchor[1]-2;if(m<0){m+=12;y--}
  S.cal={y,m,a:r?r.from:null,b:r?r.to:null};calRender();document.querySelector(".calm .x")?.focus();
}

/* ── Kanban view ── */
function kanbanView(list){
  let h=`<div class="track"><button data-act="pan" data-d="-1" id="pan-l" aria-label="Show previous columns">${ic("left")}</button><div class="t" role="scrollbar" aria-label="Board horizontal scroll position" aria-controls="board" aria-valuenow="0"><i id="thumb"></i></div><button data-act="pan" data-d="1" id="pan-r" aria-label="Show next columns">${ic("right")}</button></div>
<div class="board" id="board" role="region" aria-label="Work status board by priority. Scroll horizontally to view additional columns." tabindex="0"><div class="board-in">
<div class="cols">${ST.map(([k,n])=>`<div class="col-h"><h2>${n}</h2><span class="n">${list.filter(t=>t.s===k).length}</span></div>`).join("")}</div>`;
  LANES.forEach(p=>{
    const items=list.filter(t=>rowOf(t)===p.k),shut=!!S.shut[p.k];
    h+=`<section class="lane lane-${p.k} p-${p.k}${shut?" shut":""}" aria-label="${p.name}">
<div class="lane-head" data-p="${p.k}"><button class="lane-toggle" data-act="lane" data-k="${p.k}" aria-expanded="${!shut}">${ic("down")}<i class="lane-dot"></i><span class="lane-name">${p.name}</span><span class="lane-n">${items.length}</span><span class="lane-sev">${esc(p.sev)}</span></button><i class="lane-rule"></i></div>`;
    if(!shut)h+=`<div class="cells">${ST.map(([k,n])=>{
      const cs=items.filter(t=>t.s===k);
      return `<div class="cell" data-p="${p.k}" data-s="${k}" aria-label="${p.name}, ${n}">${cs.map(kcard).join("")}<button class="addc${cs.length?"":" solo"}" data-act="new" data-p="${p.k}" data-s="${k}" aria-label="Add a signal to ${p.name}, ${n}">${ic("plus")}<span class="lbl-add">Add signal</span>${cs.length?"":`<span class="lbl-none">No items</span>`}</button></div>`;
    }).join("")}</div>`;
    h+=`</section>`;
  });
  const gone=T.filter(t=>t.gone&&t.kind===S.kind);
  return h+`</div></div>
<div class="tray${S.tray?" open":""}"><button class="tray-bar" data-act="tray" aria-expanded="${S.tray}">${ic("down")}<span class="lane-name">Dismissed</span><span class="lane-n">${gone.length}</span><span class="lane-sev">Off the board. Drop a card here to dismiss it.</span></button>${S.tray?`<div class="tray-list">${gone.length?gone.map(t=>`<div class="tr"><span class="type">${KM[t.kind][1]}</span><b>${esc(t.title)}</b><span class="tr-m">was ${SM[t.s]} · ${LM[rowOf(t)].name}</span><span class="id">#${t.id}</span><button class="btn" data-act="restore" data-id="${t.id}">Restore</button></div>`).join(""):`<div class="empty">Nothing dismissed</div>`}</div>`:""}</div>`;
}
const kcard=t=>{const open=!!S.open[t.id];return `<article class="kc p-${t.p}${t.official?" official":""}" draggable="true" data-id="${t.id}">
<div class="kc-top">${typeDD(t)}${mark(t)}<span class="sp"></span><button class="kdots" data-act="menu" data-id="${t.id}" aria-label="More actions" aria-haspopup="true">···</button>${ic("grip")}</div>
<h3><button data-act="edit" data-id="${t.id}" title="Edit">${esc(t.title)}</button></h3>${summary(t)}
<div class="meta">${t.pinned?`<span class="uprio p-${t.p}"><i class="lane-dot"></i>${PM[t.p].name}</span>`:""}<span>${t.manual?"created":"seen"} ${t.seen}</span></div>
<footer><button class="det" data-act="details" data-id="${t.id}" aria-expanded="${open}">${ic("down")}Details</button><span class="id">#${t.id}</span></footer>
${open?detail(t,true):""}</article>`};

/* ── Edit dialog (same one from both views) ── */
function openEdit(t){
  S.edit={id:t.id,d:{title:t.title,desc:t.desc,ctx:t.ctx,pi:t.pi,pa:t.pa,raci0:t.raci[0],raci1:t.raci[1],raci2:t.raci[2],raci3:t.raci[3]}};
  drawer();document.getElementById("ed-title")?.focus();
}
// Manual creation: a draft record (id 0) sits behind the same dialog until it is saved.
// From the header it defaults to Acknowledged / No priority; from a board cell it takes that cell's row and column.
function openNew(row,s){
  DRAFT={id:0,draft:true,manual:true,title:"",desc:"",ctx:"",p:row&&row!=="pinned"?row:"none",pinned:row==="pinned",s:s||"ack",seen:fmt(TODAY).split(",")[0],date:TODAY,canP:true,canD:true,kind:S.kind,official:false,edited:false,verified:true,gone:false,mem:[ME],chan:"Manual entry",conf:null,serial:"",raci:["—","—","—","—"],piC:null,pi:"",paC:null,pa:""};
  S.edit={id:0,err:"",d:{title:"",desc:"",ctx:"",pi:"",pa:"",raci0:"",raci1:"",raci2:"",raci3:""}};
  drawer();document.getElementById("ed-title")?.focus();
}
function drawer(){
  const e=S.edit,t=e&&byId(e.id);
  if(!t||t.gone){S.edit=null;$("#layer").innerHTML="";return}
  const d=e.d,nw=!!t.draft;
  $("#layer").innerHTML=`<div class="scrim" data-act="cancel"></div>
<section class="modal" role="dialog" aria-modal="true" aria-label="${nw?"New signal":"Edit #"+t.id}">
  <header class="md-h">${typeDD(t)}<span class="id">${nw?"New signal":"#"+t.id}</span><span class="sp"></span><button class="x" data-act="cancel" aria-label="Close">${ic("x")}</button></header>
  ${nw?"":`<div class="md-acts"><button class="btn hot" data-act="promote" data-id="${t.id}" ${t.canP&&!t.official?"":"disabled"}>${t.official?"Promoted":"Promote"}</button><span class="sp"></span><button class="btn dots" data-act="menu" data-id="${t.id}" aria-label="More actions" aria-haspopup="true">···</button></div>`}
  <div class="md-body">
    <div><input class="md-title" id="ed-title" data-f="title" value="${esc(d.title)}" placeholder="Title" aria-label="Title">${e.err?`<small class="err" role="alert">${esc(e.err)}</small>`:""}</div>
    <div class="meta">${mark(t)}${pill(t)}<span>${t.manual?"created":"seen"} ${t.seen}, 2026</span><span class="inl">${ic(CI[t.chan]||"chat")}${esc(t.chan)}</span>${t.manual?"":`<span>${pct(t.conf)} confidence</span>`}</div>
    <div class="md-row"><div><h6>Work status</h6><small>${nw?"Where the new signal lands on the board.":"Move this item between the six workflow phases."}</small></div>${statusDD(t)}</div>
    <label><span class="h6">Summary</span><textarea id="ed-desc" data-f="desc" rows="3">${esc(d.desc)}</textarea>${t.manual?"":`<small>Editing marks this record Human edited. The AI original remains in version history.</small>`}</label>
    <label><span class="h6">Full context</span><textarea id="ed-ctx" data-f="ctx" rows="${nw?3:5}">${esc(d.ctx)}</textarea><small>This is the detailed expansion shown from the item's (more) control.${t.manual?"":" Keep it grounded in the record sources."}</small></label>
    <div><h6>Members</h6><p class="md-mem">${esc(t.mem.join(" / "))}</p></div>
    <div class="md-grid">
      <div><h6>RACI ${mark(t)}</h6><div class="raci">${RN.map((n,i)=>`<div><b>${n[0]}</b><dt>${n}</dt><input id="ed-raci${i}" data-f="raci${i}" value="${esc(d["raci"+i])}" placeholder="—" aria-label="${n}"></div>`).join("")}</div></div>
      <label><span class="h6">Possible impact ${pct(t.piC)} ${mark(t)}</span><textarea id="ed-pi" data-f="pi" rows="${nw?3:5}">${esc(d.pi)}</textarea></label>
      <label><span class="h6">Possible action ${pct(t.paC)} ${mark(t)}</span><textarea id="ed-pa" data-f="pa" rows="${nw?3:5}">${esc(d.pa)}</textarea></label>
    </div>
  </div>
  <footer class="md-f"><small>${nw?`Created by you and marked Human verified. It lands in ${KM[t.kind][2]} · ${SM[t.s]} · ${LM[rowOf(t)].name}.`:t.manual?`Editing #${t.id} · created manually; your edit is attributed to the current user.`:`Editing #${t.id} · original by AI extractor; your edit is attributed to the current user.`}</small>${nw?"":`<button class="btn" data-act="stub" data-n="Version history">Version history</button>`}<button class="btn" data-act="cancel">Cancel</button><button class="btn hot" data-act="save">${nw?"Create signal":"Save changes"}</button></footer>
</section>`;
}

/* ── Render ── */
function render(){
  const list=visible(),b=$("#board"),pos=b?[b.scrollLeft,b.scrollTop]:null;
  const total=kindTotal(S.kind),off=T.filter(t=>t.official&&!t.gone&&t.kind===S.kind).length,mine=T.filter(t=>t.kind===S.kind&&!t.gone).length;
  $("#kinds").innerHTML=KINDS.map(k=>`<button class="tab sub${k[0]===S.kind?" on":""}" data-act="tab" data-k="${k[0]}" ${k[0]===S.kind?'aria-current="true"':""}>${k[2]} <span class="badge">${kindTotal(k[0])}</span></button>`).join("");
  $("#h1").textContent=KM[S.kind][2];
  $("#counts").innerHTML=`<b>${off} official</b> · ${total-off} suggested`;
  $("#activerow").hidden=!S.range;
  const kn=$("#kindnote");kn.hidden=mine>0;
  kn.textContent=mine?"":`None of the sample records is a ${KM[S.kind][1].toLowerCase()} yet. Open Actions, change a card's type to ${KM[S.kind][1]}, and it moves here.`;
  $("#app").classList.toggle("kb",S.view==="kanban");
  $("#v-kanban").setAttribute("aria-pressed",S.view==="kanban");
  $("#v-list").setAttribute("aria-pressed",S.view==="list");
  $("#rchip").innerHTML=S.range?`<span class="rchip">Seen ${esc(rangeLabel(S.range))}<button data-act="clearrange" aria-label="Clear date range">${ic("x")}</button></span>`:"";
  $("#view").innerHTML=S.view==="kanban"?kanbanView(list):listView(list);
  const nb=$("#board");
  if(nb){if(pos){nb.scrollLeft=pos[0];nb.scrollTop=pos[1]}nb.addEventListener("scroll",thumb,{passive:true});thumb()}
  drawer();
}
function thumb(){
  const b=$("#board"),th=$("#thumb");if(!b||!th)return;
  const w=b.scrollWidth,c=b.clientWidth,x=b.scrollLeft;
  th.closest(".track").hidden=w<=c+1;
  th.style.width=Math.min(100,c/w*100)+"%";th.style.left=(x/w*100)+"%";
  $("#pan-l").disabled=x<=1;$("#pan-r").disabled=x+c>=w-1;
}
addEventListener("resize",thumb);

/* ── Toast + popover ── */
let toastT;
function toast(msg,undo){
  document.querySelector(".toast")?.remove();
  const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");
  el.innerHTML=`<span>${esc(msg)}</span>`;
  if(undo){const u=document.createElement("button");u.textContent="Undo";u.onclick=()=>{undo();el.remove();render()};el.appendChild(u)}
  document.querySelector(".main").appendChild(el);
  clearTimeout(toastT);toastT=setTimeout(()=>el.remove(),undo?6000:2600);
}
const pop=$("#pop");
function showPop(anchor,cls,html){
  pop.className="pop "+cls;pop.innerHTML=html;pop.hidden=false;
  const r=anchor.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
  let x=Math.min(r.left,innerWidth-w-12),y=r.bottom+6;
  if(y+h>innerHeight-12)y=Math.max(12,r.top-h-6);
  pop.style.left=Math.max(12,x)+"px";pop.style.top=y+"px";
}
const hidePop=()=>{pop.hidden=true};
function dismiss(t){if(t.gone)return;t.gone=true;toast(`#${t.id} dismissed`,()=>{t.gone=false});render()}
function move(t,row,s,quiet){
  const from={p:t.p,s:t.s,pin:t.pinned},fr=rowOf(t);if(fr===row&&from.s===s)return;
  if(row==="pinned")t.pinned=true;else{t.pinned=false;t.p=row}
  t.s=s;
  const parts=[];if(from.s!==s)parts.push(SM[s]);if(fr!==row)parts.push(LM[row].name);
  if(t.draft){drawer();return}
  if(!quiet)toast(`#${t.id} moved to ${parts.join(" · ")}`,()=>{t.p=from.p;t.s=from.s;t.pinned=from.pin});
  render();
}

/* ── Events ── */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(!a){if(!e.target.closest("#pop"))hidePop();return}
  const act=a.dataset.act,t=a.dataset.id?byId(a.dataset.id):null;
  if(!a.closest("#pop")&&!["prio","menu","status","kind","notes"].includes(act))hidePop();
  switch(act){
    case"tab":S.kind=a.dataset.k;render();document.querySelector(".scroll").scrollTop=0;break;
    case"kind":showPop(a,"menu",`<h6>Signal type</h6>`+KINDS.map(k=>`<button class="mi${t.kind===k[0]?" on":""}" data-act="setkind" data-id="${t.id}" data-k="${k[0]}">${k[1]}</button>`).join("")+(t.official||t.edited||t.verified?"":`<small class="pophint">Pick ${KM[t.kind][1]} again to confirm it and mark this record Human verified.</small>`));break;
    case"setkind":{hidePop();if(t.draft){t.kind=a.dataset.k;drawer();break}const from=t.kind,to=a.dataset.k;
      if(from===to){if(t.official||t.edited||t.verified){toast(`#${t.id} is already Human verified`);break}
        t.verified=true;toast(`#${t.id} confirmed as ${from==="action"?"an":"a"} ${KM[to][1].toLowerCase()} and marked Human verified`,()=>{t.verified=false});render();break}t.kind=to;toast(`#${t.id} is now a ${KM[to][1].toLowerCase()} and sits under ${KM[to][2]}`,()=>{t.kind=from});render();break}
    case"view":S.view=a.dataset.v==="list"?"list":"kanban";render();document.querySelector(".scroll").scrollTop=0;break;
    case"sort":S.desc=!S.desc;render();break;
    case"cal":calOpen();break;
    case"calcancel":S.cal=null;calRender();break;
    case"calnav":{const c=S.cal;c.m+=+a.dataset.d;if(c.m<0){c.m=11;c.y--}else if(c.m>11){c.m=0;c.y++}calRender();break}
    case"calday":{const c=S.cal,d=a.dataset.d;if(!c.a||c.b){c.a=d;c.b=null}else if(d<c.a){c.b=c.a;c.a=d}else c.b=d;calRender();break}
    case"calpre":{const c=S.cal,k=a.dataset.n;c.b=TODAY;c.a=k==="year"?"2026-01-01":shift(TODAY,1-(+k));const [y,m]=c.b.split("-").map(Number);c.y=m===1?y-1:y;c.m=m===1?11:m-2;calRender();break}
    case"calclear":S.range=null;S.cal=null;calRender();render();break;
    case"calapply":{const c=S.cal;S.range={from:c.a,to:c.b||c.a};S.cal=null;calRender();render();toast(`Showing extractions seen ${rangeLabel(S.range)}`);break}
    case"clearrange":S.range=null;render();break;
    case"mini":{const m=$("#app").classList.toggle("mini");a.setAttribute("aria-label",m?"Expand sidebar":"Collapse sidebar");setTimeout(thumb,0);break}
    case"stub":if(a.closest("#pop"))hidePop();toast(`${a.dataset.n} is outside this prototype`);break;
    case"sync":toast("Sync started. Prototype data stays as is.");break;
    case"filter":S.filter=!S.filter;$("#search").hidden=!S.filter;a.classList.toggle("on",S.filter);a.setAttribute("aria-expanded",S.filter);if(S.filter)$("#q").focus();else{S.q="";$("#q").value="";render()}break;
    case"lane":S.shut[a.dataset.k]=!S.shut[a.dataset.k];render();break;
    case"pan":{const b=$("#board"),step=parseFloat(getComputedStyle(b.querySelector(".col-h")).width)+12;b.scrollBy({left:step*a.dataset.d,behavior:"smooth"});break}
    case"details":S.open[t.id]=!S.open[t.id];render();break;
    case"promote":t.official=true;toast(`#${t.id} promoted to official`,()=>{t.official=false});render();break;
    case"dismiss":t.gone=true;toast(`#${t.id} dismissed`,()=>{t.gone=false});render();break;
    case"more":S.more[t.id]=!S.more[t.id];render();break;
    case"edit":hidePop();openEdit(t);break;
    case"cancel":S.edit=null;DRAFT=null;drawer();break;
    case"new":openNew(a.dataset.p,a.dataset.s);break;
    case"save":if(S.edit&&S.edit.id===0){const x=S.edit,r=DRAFT,d=x.d;
      if(!d.title.trim()){x.err="Give the signal a title before creating it.";drawer();document.getElementById("ed-title")?.focus();break}
      const id=Math.max(...T.map(t=>t.id))+1;
      Object.assign(r,{id,draft:false,title:d.title.trim(),desc:d.desc.trim(),ctx:d.ctx,pi:d.pi,pa:d.pa,raci:[d.raci0,d.raci1,d.raci2,d.raci3].map(v=>v.trim()||"—")});
      T.push(r);DRAFT=null;S.edit=null;S.shut[rowOf(r)]=false;S.kind=r.kind;
      toast(`#${id} created in ${KM[r.kind][2]} · ${SM[r.s]} · ${LM[rowOf(r)].name}`,()=>{T.splice(T.indexOf(r),1)});render();break}
    else{const x=S.edit,r=byId(x.id),d=x.d,old={title:r.title,desc:r.desc,ctx:r.ctx,pi:r.pi,pa:r.pa,raci:r.raci,edited:r.edited};
      Object.assign(r,{title:d.title.trim()||r.title,desc:d.desc,ctx:d.ctx,pi:d.pi,pa:d.pa,raci:[d.raci0,d.raci1,d.raci2,d.raci3].map(v=>v.trim()||"—"),edited:true});
      S.edit=null;toast(`#${r.id} saved and marked Human edited`,()=>Object.assign(r,old));render();break}
    case"status":showPop(a,"menu",`<h6>Workflow status</h6>`+ST.map(([k,n])=>`<button class="mi${!t.gone&&t.s===k?" on":""}" data-act="sets" data-id="${t.id}" data-k="${k}">${n}</button>`).join("")+(t.draft?"":`<hr><button class="mi${t.gone?" on":""}" data-act="sets" data-id="${t.id}" data-k="dismissed">Dismissed</button>`));break;
    case"sets":{hidePop();const k=a.dataset.k;if(k==="dismissed")dismiss(t);else if(t.gone){t.gone=false;t.s=k;toast(`#${t.id} restored to ${SM[k]}`,()=>{t.gone=true});render()}else move(t,rowOf(t),k);break}
    case"restore":t.gone=false;toast(`#${t.id} restored to ${SM[t.s]} · ${LM[rowOf(t)].name}`,()=>{t.gone=true});render();break;
    case"tray":S.tray=!S.tray;render();break;
    case"showgone":S.showGone=!S.showGone;render();break;
    case"prio":showPop(a,"menu",`<h6>Priority</h6>`+LANES.map(p=>`<button class="mi p-${p.k}${rowOf(t)===p.k?" on":""}" data-act="setp" data-id="${t.id}" data-k="${p.k}"><i class="lane-dot"></i>${p.name}</button>`).join(""));break;
    case"pin":hidePop();move(t,t.pinned?t.p:"pinned",t.s);break;
    case"setp":hidePop();move(t,a.dataset.k,t.s);break;
    case"menu":showPop(a,"menu",`<button class="mi" data-act="pin" data-id="${t.id}">${t.pinned?"Unpin":"Pin"}</button><button class="mi" data-act="edit" data-id="${t.id}">Edit</button><button class="mi" data-act="stub" data-n="Snooze">Snooze</button><hr><button class="mi" data-act="stub" data-n="Open source">Open source ${ic("ext")}</button>`);break;
    case"notes":showPop(a,"note",`<h5>Prototype notes</h5><p>Kanban rows come from the severity already on each task. No new field is needed.</p><table><tr><td>Pinned</td><td>Any priority, kept underneath</td></tr><tr><td>Critical</td><td>Urgent · High impact</td></tr><tr><td>High priority</td><td>Not urgent · High impact</td></tr><tr><td>Medium priority</td><td>Urgent · Low impact</td></tr><tr><td>Low priority</td><td>Not urgent · Low impact</td></tr><tr><td>No priority</td><td>Severity not set</td></tr></table><p>Columns reuse the Junkola workspace workflow. Task titles and severities are the 20 in the Me view. New signal (header button, or the + in any board cell) creates a record by hand: it is Human verified from the start, has no confidence score or source link, and its channel reads Manual entry. Dismissed is a workflow status, not a column: dismissed records leave the board and counts and wait in the Dismissed tray, where Restore returns them to their old column and row. Every sample record starts as an action. Changing a card's type moves it to that tab and updates the counts. Members, RACI, impact, action and full context are copied from the live cards. Workflow statuses, and the two tasks without a severity, are sample values.</p>`);break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!pop.hidden)hidePop();else if(S.cal){S.cal=null;calRender()}else if(S.edit){S.edit=null;DRAFT=null;drawer()}}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList?.contains("kc")){e.preventDefault();e.target.click()}
});
$("#q").addEventListener("input",e=>{S.q=e.target.value;render()});
document.addEventListener("input",e=>{const f=e.target.dataset?.f;if(f&&S.edit){S.edit.d[f]=e.target.value;if(f==="title"&&S.edit.err){S.edit.err="";document.querySelector(".modal .err")?.remove()}}});
document.querySelector(".scroll").addEventListener("scroll",hidePop,{passive:true});

// Drag and drop between cells: column sets status, row sets priority.
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest?.(".kc");if(!c)return;dragId=c.dataset.id;c.classList.add("drag");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(x){}});
document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".drag,.over").forEach(n=>n.classList.remove("drag","over"))});
document.addEventListener("dragover",e=>{const c=e.target.closest?.(".cell,.lane-head,.tray-bar");if(!c||!dragId)return;e.preventDefault();e.dataTransfer.dropEffect="move";
  if(!c.classList.contains("over")){document.querySelectorAll(".over").forEach(n=>n.classList.remove("over"));c.classList.add("over")}});
document.addEventListener("drop",e=>{const c=e.target.closest?.(".cell,.lane-head,.tray-bar");if(!c||!dragId)return;e.preventDefault();const t=byId(dragId);dragId=null;if(t){if(c.classList.contains("tray-bar"))dismiss(t);else move(t,c.dataset.p,c.dataset.s||t.s)}});

if(innerWidth<760)$("#app").classList.add("mini");
render();
})();
</script>
</body>
</html>
